# CI for befreeman.com on Bitbucket Cloud Pipelines (free plan: 50 build minutes/month).
# Work is scaled to the trigger (design D16 in openspec/changes/archive/2026-11-14-add-mfe-platform-foundation):
#   pull requests  -> affected lint/typecheck/test/build only (no e2e)
#   main           -> all checks, then Playwright (with axe) and Lighthouse CI
#   custom: full   -> everything, on demand
#   custom: deploy-staging / deploy-production -> manual deploys (never on merge); see docs/operations.md
# Only the deploy steps declare a `deployment:`, so only they see Cloudflare credentials
# (secured deployment variables). PR and main checks run against the local compose server.

image: mcr.microsoft.com/playwright:v1.65.0-noble

clone:
  depth: full # nx affected compares against the base branch

options:
  max-time: 25

definitions:
  caches:
    pnpm:
      key:
        files:
          - pnpm-lock.yaml
      path: .pnpm-store
    # No Nx cache: Bitbucket saves a keyed cache once and never refreshes it while the key
    # exists, so a cached .nx would go stale after the first run. Scoping comes from
    # `nx affected` on PRs instead.

  steps:
    - step: &e2e-reports
        name: placeholder # anchor for shared artifact paths only
        artifacts:
          - apps/e2e/playwright-report/**
          - apps/e2e/test-results/**
          - tmp/lhci/**

pipelines:
  pull-requests:
    '**':
      - step:
          name: Affected checks (lint, typecheck, test, build)
          caches: [pnpm]
          script:
            - export NX_DAEMON=false NX_NO_CLOUD=true
            - ./tools/ci/setup.sh
            - git fetch origin "+refs/heads/${BITBUCKET_PR_DESTINATION_BRANCH}:refs/remotes/origin/${BITBUCKET_PR_DESTINATION_BRANCH}"
            - pnpm nx affected -t lint typecheck test build --base="origin/${BITBUCKET_PR_DESTINATION_BRANCH}" --head=HEAD

  branches:
    main:
      - step:
          <<: *e2e-reports
          name: All checks, e2e (axe), Lighthouse CI
          caches: [pnpm]
          script:
            - export NX_DAEMON=false NX_NO_CLOUD=true
            - ./tools/ci/setup.sh
            # All projects, not `affected --base=HEAD~1`: a fast-forward or multi-commit push
            # would skip projects changed in earlier commits. One run per merge (~3 min).
            - pnpm nx run-many -t lint typecheck test build
            - pnpm nx run e2e:e2e
            - pnpm nx run e2e:lighthouse

  custom:
    full:
      - step:
          <<: *e2e-reports
          name: Everything (all checks, e2e, Lighthouse CI)
          caches: [pnpm]
          script:
            - export NX_DAEMON=false NX_NO_CLOUD=true
            - ./tools/ci/setup.sh
            - pnpm nx run-many -t lint typecheck test build
            - pnpm nx run e2e:e2e
            - pnpm nx run e2e:lighthouse

    # Manual deploys (Pipelines → Run pipeline, or a commit's "Run pipeline"). Nothing deploys on merge.
    # Set DEPLOY_ALL=true for the first deploy or after a rollback (docs/operations.md → Deploying).
    deploy-staging:
      - variables:
          - name: DEPLOY_ALL
            default: 'false'
            allowed-values: ['false', 'true']
      - step:
          <<: *e2e-reports
          name: Deploy to staging, e2e against staging, mark verified
          deployment: staging
          caches: [pnpm]
          script:
            - export NX_DAEMON=false NX_NO_CLOUD=true
            - ./tools/ci/setup.sh
            - if [ "$DEPLOY_ALL" = "true" ]; then ALL=--all; else ALL=; fi
            - pnpm release deploy --remote --env staging --base-url "$STAGING_URL" $ALL
            - (cd apps/e2e && E2E_BASE_URL="$STAGING_URL" pnpm exec playwright test)
            - pnpm release mark-verified --remote --env staging

    deploy-production:
      - variables:
          - name: DEPLOY_ALL
            default: 'false'
            allowed-values: ['false', 'true']
      - step:
          name: Deploy to production (staging-verified commits only)
          deployment: production
          caches: [pnpm]
          script:
            - export NX_DAEMON=false NX_NO_CLOUD=true
            - ./tools/ci/setup.sh
            - if [ "$DEPLOY_ALL" = "true" ]; then ALL=--all; else ALL=; fi
            - pnpm release deploy --remote --env production --base-url "$PRODUCTION_URL" $ALL
