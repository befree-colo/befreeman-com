# CI/CD for befreeman.com on GitHub Actions.
#   pull requests -> affected lint/typecheck/test/build
#   main          -> all checks, Playwright (with axe), Lighthouse CI
#                 -> deploy staging (tools/deploy/deploy.sh: release, e2e against staging, mark-verified)
#                 -> deploy production, the same commit, after approval on the `production` environment
# Cloudflare credentials and preview secrets are environment secrets, available only to the deploy
# jobs on main; pull-request and check jobs can't read them. See docs/operations.md -> Deploying.

name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # re-run checks and deploys for main on demand
    inputs:
      all:
        description: Release every part (--all), e.g. the first deploy after a `release rollback`
        type: boolean
        default: false

permissions:
  contents: read

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'

jobs:
  affected:
    name: Affected checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Chromium and its system libraries preinstalled. Keep the tag equal to @playwright/test in package.json.
    container: &playwright
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host # Chromium needs more shared memory than Docker's default
    timeout-minutes: 25
    concurrency:
      group: pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # nx affected compares against the base branch
      - uses: ./.github/actions/setup # browser-mode unit tests use the image's Chromium
      - run: pnpm nx affected -t lint typecheck test build --base="origin/${{ github.base_ref }}" --head=HEAD

  checks:
    name: All checks, e2e (axe), Lighthouse CI
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: *playwright
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # All projects, not `affected`: a push can carry several commits.
      - run: pnpm nx run-many -t lint typecheck test build
      - run: pnpm nx run e2e:e2e
      - run: pnpm nx run e2e:lighthouse
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: e2e-reports
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            tmp/lhci/
          if-no-files-found: ignore
          retention-days: 14

  deploy-staging:
    name: Deploy staging
    needs: checks
    runs-on: ubuntu-latest
    container: *playwright
    timeout-minutes: 30
    environment:
      name: staging
      url: https://staging.befreeman.com
    # One deploy per environment at a time; queued runs wait instead of cancelling a deploy mid-way.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      contents: write # push the deployed/staging/<ts> audit tag
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # deploy.sh checks HEAD is on origin/main; the planner diffs against deploy:commit
      - uses: ./.github/actions/setup # smoke checks and the e2e suite against staging use the image's Chromium
      - run: tools/deploy/deploy.sh staging ${{ inputs.all && '--all' || '' }}

  deploy-production:
    name: Deploy production
    needs: deploy-staging
    runs-on: ubuntu-latest
    container: *playwright
    timeout-minutes: 30
    # Add a required reviewer to the `production` environment (Settings -> Environments) so this
    # job waits for approval. Without one it deploys right after staging.
    environment:
      name: production
      url: https://befreeman.com
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: write # push the deployed/production/<ts> audit tag
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PREVIEW_SECRET: ${{ secrets.PREVIEW_SECRET }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup # promotion smoke checks use the image's Chromium
      - run: tools/deploy/deploy.sh production ${{ inputs.all && '--all' || '' }}
